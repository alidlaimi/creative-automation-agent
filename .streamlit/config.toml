# Projektweite Streamlit-Einstellungen
[server]
# Kein automatisches Öffnen des Browsers (in WSL nicht möglich) – URL von Hand öffnen
headless = true
# Nur auf diesem Rechner erreichbar, nicht im Netzwerk oder Internet
address = "localhost"

[browser]
# Keine Nutzungsstatistik an Streamlit senden
gatherUsageStats = false
